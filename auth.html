<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — TruthStamp</title>
  <meta name="description" content="Start stamping in 60 seconds. Email or Google — no wallet required.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/analytics.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>

  <style>
    .auth-shell {
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-6);
    }
    .auth-card {
      max-width: 420px;
      width: 100%;
    }

    /* Mobile responsive */
    @media (max-width: 480px) {
      body { padding: var(--space-4) var(--space-3); align-items: flex-start; padding-top: var(--space-8); }
      .auth-card { max-width: 100%; }
      .auth-title { font-size: var(--text-xl); }
      .input { font-size: 16px !important; } /* Prevents iOS zoom on focus */
      .btn { font-size: var(--text-sm); }
    }
    .auth-header {
      text-align: center;
      margin-bottom: var(--space-8);
    }
    .auth-title {
      font-size: var(--text-2xl);
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 var(--space-2);
    }
    .auth-subtitle {
      font-size: var(--text-base);
      color: var(--color-text-secondary);
      margin: 0;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: var(--space-6);
      border-bottom: 1px solid var(--color-border);
    }
    .auth-tab {
      flex: 1;
      padding: var(--space-3) 0;
      font-size: var(--text-base);
      font-weight: 500;
      color: var(--color-text-muted);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      font-family: inherit;
      transition: all var(--transition-fast);
    }
    .auth-tab:hover { color: var(--color-text); }
    .auth-tab.active {
      color: var(--brand-primary);
      border-bottom-color: var(--brand-primary);
    }

    .auth-panel { display: none; }
    .auth-panel.active { display: block; }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      width: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: var(--text-base);
      font-weight: 500;
      color: var(--color-text);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .btn-google:hover { background: var(--color-surface-alt); }
    .google-icon { width: 18px; height: 18px; flex-shrink: 0; }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin: var(--space-5) 0;
      color: var(--color-text-muted);
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .form-group { margin-bottom: var(--space-4); }

    .auth-toggle {
      text-align: center;
      margin-top: var(--space-6);
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }
    .auth-toggle a {
      color: var(--brand-primary);
      font-weight: 500;
    }

    .wallet-section {
      margin-top: var(--space-8);
      padding-top: var(--space-6);
      border-top: 1px solid var(--color-border);
    }
    .wallet-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: var(--space-3);
      background: none;
      border: none;
      font-family: inherit;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: color var(--transition-fast);
    }
    .wallet-toggle:hover { color: var(--color-text); }
    .wallet-arrow {
      width: 12px;
      height: 12px;
      transition: transform var(--transition-fast);
    }
    .wallet-toggle.expanded .wallet-arrow { transform: rotate(180deg); }
    .wallet-options {
      display: none;
      margin-top: var(--space-4);
    }
    .wallet-options.show { display: block; }
    .wallet-btn {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      width: 100%;
      padding: 12px 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
      margin-bottom: var(--space-2);
      font-family: inherit;
      text-align: left;
    }
    .wallet-btn:hover { background: var(--color-surface-alt); }
    .wallet-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .spinner-sm {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: wallet-spin 0.7s linear infinite;
    }
    @keyframes wallet-spin { to { transform: rotate(360deg); } }
    .wallet-info {
      flex: 1;
    }
    .wallet-name {
      font-size: var(--text-base);
      font-weight: 500;
      margin: 0;
    }
    .wallet-desc {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      margin: 0;
    }

    .terms {
      text-align: center;
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      margin-top: var(--space-6);
      line-height: 1.5;
    }
    .terms a {
      color: var(--color-text-secondary);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <span class="nav-logo">T</span>
        <span>TruthStamp</span>
      </a>
      <div class="nav-links">
        <a href="trust.html">Trust</a>
        <a href="pricing.html">Pricing</a>
      </div>
    </div>
  </nav>

  <main class="auth-shell">
    <div class="auth-card">

      <!-- Header -->
      <div class="auth-header">
        <h1 class="auth-title">Start stamping</h1>
        <p class="auth-subtitle">10 free credits to get started. No credit card required.</p>
      </div>

      <!-- Tabs: Sign up / Sign in -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-panel="signup" onclick="switchPanel('signup')">Sign up</button>
        <button class="auth-tab" data-panel="signin" onclick="switchPanel('signin')">Sign in</button>
      </div>

      <!-- Sign up panel -->
      <div class="auth-panel active" id="panel-signup">

        <!-- Google — coming soon -->
        <button class="btn-google" onclick="handleGoogle()" style="opacity:0.6; cursor:default;" title="Coming soon">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google <span style="font-size:11px; color:var(--color-text-muted);">(coming soon)</span>
        </button>

        <div class="auth-divider">or</div>

        <!-- Email signup form -->
        <form onsubmit="handleSignup(event)">
          <div class="form-group">
            <label class="label" for="signup-email">Email</label>
            <input type="email" class="input" id="signup-email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="label" for="signup-password">Password</label>
            <input type="password" class="input" id="signup-password" placeholder="At least 8 characters" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Create account</button>
        </form>

        <p class="auth-toggle">
          Already have an account? <a href="#" onclick="switchPanel('signin'); return false;">Sign in</a>
        </p>
      </div>

      <!-- Sign in panel -->
      <div class="auth-panel" id="panel-signin">

        <!-- Google — coming soon -->
        <button class="btn-google" onclick="handleGoogle()" style="opacity:0.6; cursor:default;" title="Coming soon">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google <span style="font-size:11px; color:var(--color-text-muted);">(coming soon)</span>
        </button>

        <div class="auth-divider">or</div>

        <form onsubmit="handleSignin(event)">
          <div class="form-group">
            <label class="label" for="signin-email">Email</label>
            <input type="email" class="input" id="signin-email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <div class="flex-between">
              <label class="label" for="signin-password" style="margin-bottom: 0;">Password</label>
              <a href="#" onclick="handleForgotPassword(event); return false;" style="font-size: var(--text-xs); color: var(--brand-primary);">Forgot?</a>
            </div>
            <input type="password" class="input" id="signin-password" required style="margin-top: var(--space-2);">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
        </form>

        <p class="auth-toggle">
          Don't have an account? <a href="#" onclick="switchPanel('signup'); return false;">Sign up</a>
        </p>
      </div>

      <!-- Wallet section (collapsed by default — secondary option per peer's advice) -->
      <div class="wallet-section">
        <button class="wallet-toggle" id="wallet-toggle" onclick="toggleWallet()">
          Advanced: connect wallet
          <svg class="wallet-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <div class="wallet-options" id="wallet-options">
          <button class="wallet-btn" onclick="connectWallet('metamask')">
            <div class="wallet-icon" style="background: #F6851B;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M22 4L13 12L9 8L2 15V21H22V4Z"/></svg>
            </div>
            <div class="wallet-info">
              <p class="wallet-name">MetaMask</p>
              <p class="wallet-desc">Most popular Web3 wallet</p>
            </div>
          </button>
          <button class="wallet-btn" onclick="connectWallet('walletconnect')">
            <div class="wallet-icon" style="background: var(--color-info-bg);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12a4 4 0 018 0"/></svg>
            </div>
            <div class="wallet-info">
              <p class="wallet-name">WalletConnect</p>
              <p class="wallet-desc">Use any wallet via QR code</p>
            </div>
          </button>
        </div>
      </div>

      <!-- Terms -->
      <p class="terms">
        By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
      </p>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script>
    // -----------------------------------------------------------------
    // If user is already logged in, redirect away from this page
    // -----------------------------------------------------------------
    if (window.tsRedirectIfAuthed) {
      window.tsRedirectIfAuthed();
    }

    // -----------------------------------------------------------------
    // UI tab switching (sign up / sign in panels)
    // -----------------------------------------------------------------
    function switchPanel(panel) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-panel="${panel}"]`).classList.add('active');
      document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`panel-${panel}`).classList.add('active');
      hideMessage();
    }

    function toggleWallet() {
      const toggle = document.getElementById('wallet-toggle');
      const options = document.getElementById('wallet-options');
      toggle.classList.toggle('expanded');
      options.classList.toggle('show');
      if (window.trackEvent && options.classList.contains('show')) {
        window.trackEvent('wallet_options_expanded');
      }
    }

    // -----------------------------------------------------------------
    // Inline message helpers (success / error display)
    // -----------------------------------------------------------------
    function showMessage(text, isError) {
      let msg = document.getElementById('auth-message');
      if (!msg) {
        msg = document.createElement('div');
        msg.id = 'auth-message';
        msg.style.cssText = 'padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; line-height: 1.5;';
        const card = document.querySelector('.auth-card');
        const tabs = card.querySelector('.auth-tabs');
        card.insertBefore(msg, tabs.nextSibling);
      }
      msg.style.background = isError ? '#FEE2E2' : '#D1FAE5';
      msg.style.color = isError ? '#991B1B' : '#065F46';
      msg.style.border = isError ? '1px solid #FCA5A5' : '1px solid #6EE7B7';
      msg.textContent = text;
      msg.style.display = 'block';
    }
    function hideMessage() {
      const msg = document.getElementById('auth-message');
      if (msg) msg.style.display = 'none';
    }

    // -----------------------------------------------------------------
    // Google OAuth (placeholder — needs Google provider configured in Supabase)
    // -----------------------------------------------------------------
    async function handleGoogle() {
      if (window.trackEvent) window.trackEvent('auth_attempt', { method: 'google' });
      try {
        const { error } = await window.tsDB.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/dashboard.html' }
        });
        if (error) {
          showMessage(
            error.message.includes('not enabled')
              ? 'Google sign-in is not yet configured. Please use email signup for now.'
              : ('Sign-in failed: ' + error.message),
            true
          );
        }
      } catch (err) {
        showMessage('Could not connect. Please try email signup.', true);
      }
    }

    // -----------------------------------------------------------------
    // Sign up form handler
    // -----------------------------------------------------------------
    async function handleSignup(e) {
      e.preventDefault();
      hideMessage();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      if (window.trackEvent) window.trackEvent('auth_attempt', { method: 'email_signup' });

      const { user, error } = await window.tsAuth.signUp(email, password);

      if (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
        // Surface common errors as friendly messages
        if (error.message && error.message.toLowerCase().includes('already')) {
          showMessage('An account with that email already exists. Try signing in instead.', true);
          switchPanel('signin');
          document.getElementById('signin-email').value = email;
        } else if (error.message && error.message.toLowerCase().includes('password')) {
          showMessage(error.message, true);
        } else {
          showMessage('Sign up failed: ' + (error.message || 'Unknown error'), true);
        }
        return;
      }

      if (window.trackEvent) window.trackEvent('signup_success');

      // If email confirmation is required, user gets email; otherwise auto-login
      if (user && !user.email_confirmed_at) {
        // Email confirmation might be required (depends on Supabase settings)
        // If signed in immediately, the redirect below kicks off
        showMessage('Check your email to confirm your account, then sign in.', false);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
        return;
      }

      // Logged in — redirect to dashboard
      window.location.href = window.TRUTHSTAMP_CONFIG.POST_AUTH_REDIRECT;
    }

    // -----------------------------------------------------------------
    // Sign in form handler
    // -----------------------------------------------------------------
    async function handleSignin(e) {
      e.preventDefault();
      hideMessage();
      const email = document.getElementById('signin-email').value;
      const password = document.getElementById('signin-password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      if (window.trackEvent) window.trackEvent('auth_attempt', { method: 'email_signin' });

      const { user, error } = await window.tsAuth.signIn(email, password);

      if (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
        if (error.message && error.message.toLowerCase().includes('invalid')) {
          showMessage('Wrong email or password. Try again or reset your password.', true);
        } else {
          showMessage('Sign in failed: ' + (error.message || 'Unknown error'), true);
        }
        return;
      }

      if (window.trackEvent) window.trackEvent('signin_success');

      // Honor return_to query param if present
      const params = new URLSearchParams(window.location.search);
      const returnTo = params.get('return_to');
      window.location.href = returnTo || window.TRUTHSTAMP_CONFIG.POST_AUTH_REDIRECT;
    }

    // -----------------------------------------------------------------
    // Forgot password handler
    // -----------------------------------------------------------------
    async function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('signin-email').value.trim();
      if (!email) {
        showMessage('Enter your email above first, then click Forgot.', true);
        return;
      }
      const { error } = await window.tsAuth.sendPasswordReset(email);
      if (error) {
        showMessage('Could not send reset email: ' + error.message, true);
      } else {
        showMessage('Password reset email sent to ' + email + '.', false);
      }
    }

    // -----------------------------------------------------------------
    // Wallet (placeholder — comes later)
    // -----------------------------------------------------------------
    // -----------------------------------------------------------------
    // Wallet authentication — MetaMask + WalletConnect
    // Uses Sign-In With Ethereum (SIWE) pattern
    // -----------------------------------------------------------------
    async function connectWallet(type) {
      if (window.trackEvent) window.trackEvent('auth_attempt', { method: 'wallet', wallet_type: type });

      if (type === 'walletconnect') {
        showMessage('WalletConnect coming soon. Use MetaMask for now.', true);
        return;
      }

      // Check MetaMask is installed
      if (!window.ethereum) {
        showMessage(
          'MetaMask not found. Please install the MetaMask browser extension at metamask.io, then try again.',
          true
        );
        return;
      }

      // Update button state
      const btn = document.querySelector('[onclick="connectWallet(\'metamask\')"]');
      const originalHTML = btn?.innerHTML;
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<div class="wallet-icon" style="background:#F6851B;"><div class="spinner-sm"></div></div>
          <div class="wallet-info"><p class="wallet-name">Connecting...</p></div>`;
      }
      hideMessage();

      try {
        // Step 1: Request wallet access
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        const address = accounts[0];
        if (!address) throw new Error('No account selected');

        showMessage(`Wallet connected: ${address.slice(0,6)}...${address.slice(-4)}. Requesting signature...`, false);

        // Step 2: Get nonce from our Edge Function
        const supabaseUrl = window.TRUTHSTAMP_CONFIG.SUPABASE_URL;
        const nonceRes = await fetch(`${supabaseUrl}/functions/v1/wallet-auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'nonce', address }),
        });

        const nonceData = await nonceRes.json();
        if (!nonceRes.ok) throw new Error(nonceData.error ?? 'Failed to get nonce');

        // Step 3: Ask user to sign the message (MetaMask popup)
        showMessage('Please sign the message in MetaMask to verify wallet ownership...', false);

        let signature;
        try {
          signature = await window.ethereum.request({
            method: 'personal_sign',
            params: [nonceData.message, address],
          });
        } catch (signErr) {
          if (signErr.code === 4001) {
            throw new Error('Signature cancelled. You must sign the message to sign in.');
          }
          throw signErr;
        }

        showMessage('Verifying signature...', false);

        // Step 4: Verify signature and get session from Edge Function
        const verifyRes = await fetch(`${supabaseUrl}/functions/v1/wallet-auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'verify',
            address,
            signature,
            nonce: nonceData.nonce,
          }),
        });

        const verifyData = await verifyRes.json();
        if (!verifyRes.ok) throw new Error(verifyData.error ?? 'Signature verification failed');

        // Step 5: Set Supabase session from returned tokens
        const { error: sessionErr } = await window.tsDB.auth.setSession({
          access_token: verifyData.access_token,
          refresh_token: verifyData.refresh_token,
        });

        if (sessionErr) throw new Error('Failed to establish session');

        // Success
        showMessage(`✓ Signed in with wallet ${address.slice(0,6)}...${address.slice(-4)}! Redirecting...`, false);
        if (window.trackEvent) window.trackEvent('wallet_signin_success', { address });

        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);

      } catch (err) {
        console.error('Wallet auth error:', err);
        showMessage(err.message || 'Wallet connection failed. Please try again.', true);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalHTML;
        }
      }
    }
  </script>
